<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love Witches</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0518;font-family:Georgia,'Times New Roman',serif;color:#e8d5f5;min-height:100vh;overflow-x:hidden}
.sky{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#2a1250 0%,#17082e 45%,#0d0518 100%);z-index:-2}
.moon{position:fixed;top:36px;right:8%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffd98a,#f59e0b 75%);box-shadow:0 0 70px 22px rgba(245,158,11,.35);z-index:-1}
.fog{position:fixed;left:-20%;width:140%;height:180px;bottom:-40px;background:radial-gradient(ellipse at center,rgba(180,160,220,.20),transparent 70%);filter:blur(18px);animation:drift 15s ease-in-out infinite alternate;z-index:5;pointer-events:none}
.fog2{bottom:60px;animation-duration:22s;animation-delay:-8s;opacity:.7}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px;text-align:center}
h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:2px;color:#ffb347;text-shadow:0 0 26px rgba(255,140,0,.65),3px 3px 0 #4a148c;margin:8px 0 4px}
.sub{font-style:italic;color:#c9a8f0;font-size:clamp(1rem,2.6vw,1.25rem);margin-bottom:26px}
.scene{width:100%;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.75),0 0 0 3px rgba(255,179,71,.25);display:block}
.cauldron-zone{position:relative;margin-top:34px;display:inline-block;max-width:640px;width:100%}
.photo{width:100%;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.8),0 0 42px rgba(122,255,122,.20);display:block}
.brew{position:absolute;left:50%;transform:translateX(-50%);top:-6px;width:70%;height:60px;pointer-events:none}
.bubble{position:absolute;bottom:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d8ffb0,#7CFC00 60%,#2e7d32);opacity:0;animation:rise 3.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.95}100%{transform:translateY(-120px) scale(1.15);opacity:0}}
.steam{position:absolute;left:50%;top:-30px;width:120px;height:120px;transform:translateX(-50%);background:radial-gradient(circle,rgba(200,255,190,.28),transparent 70%);filter:blur(14px);animation:steam 4s ease-in-out infinite alternate;pointer-events:none}
@keyframes steam{from{transform:translateX(-58%) translateY(6px) scale(1)}to{transform:translateX(-42%) translateY(-14px) scale(1.25)}}
.caption{margin-top:26px;font-size:1.05rem;color:#d9c2f5}
.caption b{color:#ffb347}
a.visit{display:inline-block;margin-top:18px;background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff;text-decoration:none;font-size:1.15rem;padding:14px 34px;border-radius:999px;border:2px solid #ffb347;box-shadow:0 8px 28px rgba(123,31,162,.55);transition:transform .15s ease,box-shadow .15s ease}
a.visit:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 34px rgba(255,140,0,.45)}
.bat{position:fixed;font-size:26px;z-index:6;pointer-events:none;animation:fly 16s linear infinite}
.bat2{animation-delay:-9s;font-size:20px}
@keyframes fly{0%{left:-6%;top:14%}25%{top:8%}50%{top:16%}75%{top:9%}100%{left:104%;top:13%}}
.pumpkins{font-size:1.8rem;margin-top:30px;letter-spacing:14px}
</style>
</head>
